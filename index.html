<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Italiaanse woordjes leren</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f6ff;
      text-align: center;
      margin-top: 60px;
    }
    h1 { color: #0033cc; }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 8px;
    }
    #volgende {
      padding-top: 20px;
      padding-bottom: 20px;
      font-size: 18px;
      -webkit-appearance: none;
      border-radius: 0;
      border: 1px solid #999;
    }
    #resultaat {
      font-size: 18px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h1>🌍 Italiaanse woordjes leren (v29) 090626</h1>

  <button onclick="controleer()">Controleer</button>
  <p id="vraag1"></p>
  <input type="text" id="Vraag1" style="background-color: lightblue; width: 500px;">
  <input type="text" id="Antwoord1" style="background-color: lightpink; width: 600px;"><br>
  <input type="text" id="Vraag2" style="background-color: lightblue; width: 500px;">
  <input type="text" id="Antwoord2" style="background-color: lightpink; width: 600px;"><br>
  <input type="text" id="antwoordType" placeholder="Typ het antwoord..."><br>
  <p id="resultaat"></p>
  <button id="volgende" onclick="volgende()">Volgende</button>
  
  <script>
    const woorden = [
      { nl: "verstoppen", it: "nascondere" },
      { nl: "gek in het hoofd", it: "fuori di testa" },
      { nl: "doden, vermoorden", it: "ammazzare" },
      { nl: "lobby", it: "atrio" },
      { nl: "uitdoen", it: "togliere" },
      { nl: "nl", it: "id" },
      { nl: "nl", it: "id" },
      { nl: "nl", it: "id" },
      { nl: "nl", it: "id" },
      { nl: "nl", it: "id" },
      { nl: "zijn", it: "essere" },
      { nl: "hebben", it: "avere" },
      { nl: "kunnen, mogen [als z.nw.: macht]", it: "potere" },
      { nl: "weten, kennen; kunnen, weten hoe te [soms: smaken/ruiken/rieken (naar)]", it: "sapere" },
      { nl: "moeten [ook: verschuldigd zijn (aan), te danken hebben (aan)] [als z.nw.: plicht]", it: "dovere" },
      { nl: "willen", it: "volere" },
      { nl: "komen", it: "venire" },
      { nl: "houden, vasthouden", it: "tenere" },
      { nl: "(ver)blijven, zich bevinden, zijn", it: "stare" },
      { nl: "geven", it: "dare" },
      { nl: "gaan", it: "andare" },
      { nl: "doen; maken", it: "fare" },
      { nl: "zeggen", it: "dire" },
      { nl: "drinken", it: "bere" },
      { nl: "bevallen [leuk/lekker vinden] [als z.nw.: plezier, genoegen, genot]", it: "piacere" },
      { nl: "worden [door verandering of groei]", it: "diventare" },
      { nl: "worden [door verandering of groei]", it: "divenire" },
      { nl: "openen", it: "aprire" },
      { nl: "kussen, zoenen", it: "baciare" },
      { nl: "dansen", it: "ballare" },
      { nl: "zoeken [+ di: proberen te]", it: "cercare" },
    ];

    let huidig = 0;
    const resultaat = document.getElementById("resultaat");

    function wacht(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function toonVraag() {
      document.getElementById("vraag1").textContent = `Wat is het italiaanse woord voor:`;
      document.getElementById("Vraag2").value = woorden[huidig].nl;
      document.getElementById("Antwoord2").value = "";
      document.getElementById("antwoordType").value = "";
    }

    async function controleer() {
      const invoer = document.getElementById("antwoordType").value.trim().toLowerCase();

      // stap 1: antwoord tonen in Antwoord2
      document.getElementById("Antwoord2").value = woorden[huidig].it;
      if (invoer === woorden[huidig].it) {
        resultaat.textContent = "✅ Goed!";
      } else {
        resultaat.textContent = `❌ Fout`;
      }

      // stap 2: 1 seconde wachten
      await wacht(1000);

      // stap 3: vraag2 en antwoord2 omhoog naar vraag1 en antwoord1
      document.getElementById("Vraag1").value = document.getElementById("Vraag2").value;
      document.getElementById("Antwoord1").value = document.getElementById("Antwoord2").value;

      // stap 4: volgende woord in vraag2, antwoord2 leegmaken
      huidig = (huidig + 1) % woorden.length;
      toonVraag();
    }

    async function volgende() {
      // stap 1: antwoord tonen in Antwoord2
      document.getElementById("Antwoord2").value = woorden[huidig].it;

      // stap 2: 1 seconde wachten
      await wacht(1000);

      // stap 3: vraag2 en antwoord2 omhoog naar vraag1 en antwoord1
      document.getElementById("Vraag1").value = document.getElementById("Vraag2").value;
      document.getElementById("Antwoord1").value = document.getElementById("Antwoord2").value;

      // stap 4: volgende woord in vraag2, antwoord2 leegmaken
      huidig = (huidig + 1) % woorden.length;
      toonVraag();
    }

    toonVraag();
  </script>
</body>
</html>
